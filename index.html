<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mailboat Schedule</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=IBM+Plex+Mono:wght@400;600&display=swap');

    :root {
      --navy:   #1a2b3c;
      --ocean:  #2a5f8f;
      --foam:   #e8f4f8;
      --slate:  #4a6a80;
      --sand:   #f5f0e8;
      --alert:  #c0392b;
      --gold:   #d4a843;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--navy);
      color: var(--foam);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
    }

    /* Wave header */
    header {
      background: var(--ocean);
      padding: 2rem 1.5rem 3.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0; right: 0;
      height: 40px;
      background: var(--navy);
      clip-path: ellipse(55% 100% at 50% 100%);
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      letter-spacing: 0.02em;
      color: #fff;
    }
    header p {
      margin-top: 0.4rem;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.9;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }

    /* ── NEXT DEPARTURE CARD ── */
    #next-card {
      background: var(--ocean);
      border: 2px solid var(--gold);
      border-radius: 6px;
      padding: 1.2rem 1.4rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .next-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.25rem;
    }
    /* Time + countdown on one line */
    #time-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      line-height: 1;
    }
    #next-time {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: #fff;
    }
    #next-countdown {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: #fff;
    }
    #next-detail {
      font-size: 1.5rem;
      color: var(--foam);
      margin-top: 0.3rem;
      opacity: 0.85;
    }

    /* Blink animations — slow (15→5 min) and fast (<5 min) */
    @keyframes blink-slow  { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes blink-fast  { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes blink-grace { 0%,100%{opacity:1} 50%{opacity:0} }
    .blink-slow  { animation: blink-slow  5s    step-start infinite; }
    .blink-fast  { animation: blink-fast  3s  step-start infinite; }
    .blink-grace { animation: blink-grace 1s step-start infinite; }

    /* No more ferries state */
    #next-time.done {
      font-size: 1.1rem;
      color: var(--gold);
      animation: none;
    }

    /* ── TIMETABLE ── */
    h2.section-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.8rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--slate);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    thead th {
      text-align: left;
      padding: 0.45rem 0.6rem;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      border-bottom: 1px solid var(--slate);
      position: sticky;
      top: 0;
      background: var(--navy);
      z-index: 1;
    }
    tbody tr {
      border-bottom: 1px solid rgba(74,106,128,0.3);
      transition: background 0.15s;
    }
    tbody tr:hover {
      background: rgba(42,95,143,0.35);
    }
    tbody td {
      padding: 0.55rem 0.6rem;
      color: var(--foam);
    }
    tbody td:first-child {
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }
    .arrive-row td {
      color: rgba(211, 211, 211);
      font-style: italic;
    }

    /* Highlight the next row */
    tr.next-row td {
      background: rgba(212,168,67,0.12);
      color: #fff;
    }
    tr.next-row td:first-child {
      color: var(--gold);
    }

    /* Past rows */
    tr.past-row td {
      opacity: 0.35;
    }

    /* White border above first departure row */
    tr.first-depart-row td {
      border-top: 1px solid #fff;
    }

    /* White border below each arrival row */
    tr.arrive-row td {
      border-bottom: 1px solid #fff;
    }

    /* IN column */
    td.in-col {
      color: var(--gold);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    /* Current time display */
    #clock {
      text-align: right;
      font-size: 1.0rem;
      color: #fff;
      margin-bottom: 1rem;
    }

    /* ── TAP SPLASH SCREEN ── */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--navy);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #splash h2 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 8vw, 3.5rem);
      color: #fff;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 0 2rem;
    }
    #splash p {
      margin-top: 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
    #splash p { animation: pulse 2s ease-in-out infinite; }

    /* Hide main content until unlocked */
    body.locked header,
    body.locked main { visibility: hidden; }
  </style>
</head>
<body class="locked">

<div id="splash">
  <h2>Tap for Schedule</h2>
  <p>Mailboat · Northeast Harbor</p>
</div>

<header>
  <h1>Mailboat (beta v0.13)</h1>
  <p>Daily Timetable · Northeast Harbor</p>
</header>

<main>
  <div id="clock">Current time: --:--</div>

  <div id="next-card">
    <div>
      <div class="next-label">Next Departure</div>
      <div id="time-row">
        <span id="next-time">--:--</span>
        <span id="next-countdown"></span>
      </div>
      <div id="next-detail">&nbsp;</div>
    </div>
  </div>

  <h2 class="section-label">Full Schedule</h2>
  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Dep/Arr</th>
        <th>TIMER</th>
        <th>From</th>
        <th>To</th>
      </tr>
    </thead>
    <tbody id="schedule-body"></tbody>
  </table>
</main>

<script>
  const schedule = [
    { time: "7:30am",  type: "Depart", from: "Northeast Harbor", to: "Islesford" },
    { time: "8:00am",  type: "Depart", from: "Islesford",        to: "Cranberry" },
    { time: "8:30am",  type: "Depart", from: "Cranberry",        to: "Northeast Harbor" },
    { time: "8:50am",  type: "Arrive", from: "Northeast Harbor", to: "" },
    { time: "10:00am", type: "Depart", from: "Northeast Harbor", to: "Cranberry" },
    { time: "10:25am", type: "Depart", from: "Cranberry",        to: "Islesford" },
    { time: "10:45am", type: "Depart", from: "Islesford",        to: "Cranberry" },
    { time: "11:05am", type: "Depart", from: "Cranberry",        to: "Northeast Harbor" },
    { time: "11:25am", type: "Arrive", from: "Northeast Harbor", to: "" },
    { time: "12:00pm", type: "Depart", from: "Northeast Harbor", to: "Islesford" },
    { time: "12:30pm", type: "Depart", from: "Islesford",        to: "Cranberry" },
    { time: "1:00pm",  type: "Depart", from: "Cranberry",        to: "Islesford" },
    { time: "1:15pm",  type: "Depart", from: "Islesford",        to: "Northeast Harbor" },
    { time: "1:45pm",  type: "Arrive", from: "Northeast Harbor", to: "" },
    { time: "2:00pm",  type: "Depart", from: "Northeast Harbor", to: "Cranberry" },
    { time: "2:25pm",  type: "Depart", from: "Cranberry",        to: "Islesford" },
    { time: "2:45pm",  type: "Depart", from: "Islesford",        to: "Cranberry" },
    { time: "3:05pm",  type: "Depart", from: "Cranberry",        to: "Northeast Harbor" },
    { time: "3:25pm",  type: "Arrive", from: "Northeast Harbor", to: "" },
    { time: "4:00pm",  type: "Depart", from: "Northeast Harbor", to: "Cranberry" },
    { time: "4:25pm",  type: "Depart", from: "Cranberry",        to: "Islesford" },
    { time: "4:45pm",  type: "Depart", from: "Islesford",        to: "Cranberry" },
    { time: "5:05pm",  type: "Depart", from: "Cranberry",        to: "Northeast Harbor" },
    { time: "5:25pm",  type: "Arrive", from: "Northeast Harbor", to: "" },
    { time: "6:00pm",  type: "Depart", from: "Northeast Harbor", to: "Islesford" },
    { time: "6:30pm",  type: "Depart", from: "Islesford",        to: "Cranberry" },
    { time: "6:45pm",  type: "Depart", from: "Cranberry",        to: "Northeast Harbor" },
    { time: "7:05pm",  type: "Arrive", from: "Northeast Harbor", to: "" },
  ];

  // Parse "7:30am" → minutes since midnight
  function parseTime(str) {
    const m = str.match(/(\d+):(\d+)(am|pm)/i);
    let h = parseInt(m[1]), min = parseInt(m[2]), period = m[3].toLowerCase();
    if (period === 'pm' && h !== 12) h += 12;
    if (period === 'am' && h === 12) h = 0;
    return h * 60 + min;
  }

  // Format minutes since midnight → 12h display
  function nowMinutes() {
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }

  function formatClock(d) {
    let h = d.getHours(), min = d.getMinutes();
    const ampm = h >= 12 ? 'pm' : 'am';
    if (h > 12) h -= 12;
    if (h === 0) h = 12;
    return `${h}:${String(min).padStart(2,'0')}${ampm}`;
  }

  // Build table rows
  const tbody = document.getElementById('schedule-body');
  const firstDepartIdx = schedule.findIndex(s => s.type === 'Depart');
  schedule.forEach((row, i) => {
    const tr = document.createElement('tr');
    tr.dataset.idx = i;
    if (row.type === 'Arrive') tr.classList.add('arrive-row');
    if (i === firstDepartIdx) tr.classList.add('first-depart-row');
    tr.innerHTML = `
      <td>${row.time}</td>
      <td>${row.type}</td>
      <td class="in-col" id="in-${i}"></td>
      <td>${row.from}</td>
      <td>${row.to || '—'}</td>
    `;
    tbody.appendChild(tr);
  });

  // nowSeconds(): total seconds since midnight
  function nowSeconds() {
    const d = new Date();
    return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  }

  function formatDeltaMins(totalMins) {
    const h = Math.floor(totalMins / 60);
    const m = totalMins % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }

  // Format seconds as hh:mm (floor to minutes)
  function formatDeltaSecs(totalSecs) {
    const mins = Math.floor(totalSecs / 60);
    return formatDeltaMins(mins);
  }

  // Format a schedule time string to add space before am/pm
  function formatTimeDisplay(timeStr) {
    return timeStr.replace(/(am|pm)/i, ' $1');
  }

  // Format seconds as hh:mm:ss
  function formatDeltaSecsHMS(totalSecs) {
    const h = Math.floor(totalSecs / 3600);
    const m = Math.floor((totalSecs % 3600) / 60);
    const s = totalSecs % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function setBlinkClass(el, blink, color) {
    el.classList.remove('blink-slow', 'blink-fast', 'blink-grace');
    el.style.color = color || '#fff';
    if (blink) el.classList.add(blink);
  }

  function update() {
    const nowSecs = nowSeconds();
    const nowMins = nowSecs / 60;
    const d = new Date();
    document.getElementById('clock').textContent = `Current time: ${formatClock(d)}`;

    // Update IN column (minute granularity, positive only)
    schedule.forEach((row, i) => {
      const cell = document.getElementById(`in-${i}`);
      if (!cell) return;
      const deltaMins = parseTime(row.time) - Math.floor(nowMins);
      cell.textContent = deltaMins > 0 ? formatDeltaMins(deltaMins) : '';
    });

    // All departures with seconds
    const departures = schedule
      .map((s, i) => ({ ...s, idx: i, secs: parseTime(s.time) * 60 }))
      .filter(s => s.type === 'Depart');

    const GRACE = 5 * 60; // 5 minutes grace in seconds

    // Find the "active" departure: next upcoming, OR most recent if within grace period
    let active = null;
    let isGrace = false;

    // Check if most recent departure is within grace window
    const recent = [...departures].reverse().find(s => s.secs <= nowSecs);
    if (recent && (nowSecs - recent.secs) < GRACE) {
      active = recent;
      isGrace = true;
    } else {
      active = departures.find(s => s.secs > nowSecs) || null;
      isGrace = false;
    }

    // Table row styling — treat rows as past only after grace window
    document.querySelectorAll('#schedule-body tr').forEach(tr => {
      tr.classList.remove('past-row', 'next-row');
      const idx = parseInt(tr.dataset.idx);
      const rowSecs = parseTime(schedule[idx].time) * 60;
      const gracedOver = isGrace && active && schedule[idx].time === schedule[active.idx].time;
      if (rowSecs < nowSecs && !gracedOver) {
        tr.classList.add('past-row');
      }
    });

    const nextEl = document.getElementById('next-time');
    const countdownEl = document.getElementById('next-countdown');
    const detailEl = document.getElementById('next-detail');

    if (active) {
      // Highlight active row
      const activeRow = tbody.querySelector(`tr[data-idx="${active.idx}"]`);
      if (activeRow) {
        activeRow.classList.remove('past-row');
        activeRow.classList.add('next-row');
      }

      nextEl.textContent = formatTimeDisplay(active.time);
      nextEl.className = '';
      nextEl.style.color = '';

      const deltaSecs = active.secs - nowSecs; // negative during grace

      if (isGrace) {
        const elapsed = nowSecs - active.secs;
        const elapsedStr = formatDeltaSecsHMS(elapsed);
        countdownEl.textContent = `+${elapsedStr}`;
        setBlinkClass(nextEl,    'blink-grace', 'rgb(255, 180, 240)');
        setBlinkClass(countdownEl, 'blink-grace', 'rgb(255, 180, 240)');
        detailEl.textContent = `${active.from} → ${active.to}`;
      } else {
        if (deltaSecs <= 5 * 60) {
          countdownEl.textContent = `in ${formatDeltaSecsHMS(deltaSecs)}`;
          setBlinkClass(nextEl,    'blink-fast', 'rgb(255,180,140)');
          setBlinkClass(countdownEl, 'blink-fast', 'rgb(255,180,140)');
        } else if (deltaSecs <= 15 * 60) {
          countdownEl.textContent = `in ${formatDeltaSecs(deltaSecs)}`;
          setBlinkClass(nextEl,    'blink-slow', 'rgb(255,140,0)');
          setBlinkClass(countdownEl, 'blink-slow', 'rgb(255,140,0)');
        } else {
          countdownEl.textContent = `in ${formatDeltaSecs(deltaSecs)}`;
          setBlinkClass(nextEl,    null, '#fff');
          setBlinkClass(countdownEl, null, '#fff');
        }
        detailEl.textContent = `${active.from} → ${active.to}`;
      }
    } else {
      nextEl.textContent = 'No more ferries today';
      nextEl.className = 'done';
      countdownEl.textContent = '';
      countdownEl.className = '';
      detailEl.textContent = 'Service resumes at 7:30am';
    }
  }

  update();
  setInterval(update, 1000); // refresh every second for live countdown

  // ── TAP TO UNLOCK ──
  // Creates the AudioContext on the user gesture (satisfies browser autoplay policy),
  // then reveals the schedule and dismisses the splash.
  let audioCtx = null;

  document.getElementById('splash').addEventListener('click', () => {
    // Unlock audio
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      // Play a silent buffer to fully unlock on iOS
      const buf = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
    } catch(e) {}

    // Reveal schedule
    document.body.classList.remove('locked');
    document.getElementById('splash').style.display = 'none';
  });

  // ── 1-MINUTE DEPARTURE SOUND ──
  // Synthesized bosun's pipe call via Web Audio API — no external file needed,
  // works offline and on all browsers including Safari/iOS.
  const soundFired = new Set();

  function playBosunPipe() {
    try {
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

      // A bosun's pipe call: rise → hold high → fall → short trill
      const calls = [
        { freq: 1400, endFreq: 2100, start: 0.00, dur: 0.35, vol: 0.5 },  // rise
        { freq: 2100, endFreq: 2100, start: 0.35, dur: 0.60, vol: 0.6 },  // hold
        { freq: 2100, endFreq: 800,  start: 0.95, dur: 0.40, vol: 0.5 },  // fall
        { freq: 1200, endFreq: 1600, start: 1.40, dur: 0.15, vol: 0.4 },  // trill 1
        { freq: 900,  endFreq: 1300, start: 1.57, dur: 0.15, vol: 0.4 },  // trill 2
        { freq: 1200, endFreq: 1600, start: 1.74, dur: 0.15, vol: 0.4 },  // trill 3
      ];

      calls.forEach(({ freq, endFreq, start, dur, vol }) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
        osc.frequency.linearRampToValueAtTime(endFreq, ctx.currentTime + start + dur);
        gain.gain.setValueAtTime(0, ctx.currentTime + start);
        gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + start + 0.02);
        gain.gain.setValueAtTime(vol, ctx.currentTime + start + dur - 0.02);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
        osc.start(ctx.currentTime + start);
        osc.stop(ctx.currentTime + start + dur);
      });

      // Oscillators self-clean; shared ctx stays open for next sound
    } catch (e) {
      // Audio not available — fail silently
    }
  }

  setInterval(() => {
    const nowSecs = nowSeconds();
    schedule.forEach((row, i) => {
      if (row.type !== 'Depart') return;
      const depSecs = parseTime(row.time) * 60;
      const secsUntil = depSecs - nowSecs;
      // Fire at 5-minute mark
      if (secsUntil <= 300 && secsUntil > 298 && !soundFired.has(`${i}-5min`)) {
        soundFired.add(`${i}-5min`);
        playBosunPipe();
      }
      // Fire at 4-minute mark
      if (secsUntil <= 240 && secsUntil > 238 && !soundFired.has(`${i}-4min`)) {
        soundFired.add(`${i}-4min`);
        playBosunPipe();
      }
    });
  }, 1000);
  // ── 300 HZ DEPARTURE TONE AT 00:00 ──
  // Two 10-second bursts of a 300 Hz sine wave, separated by a 5-second pause.
  function playDepartureTone() {
    try {
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

      function burst(startTime, duration) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 300;
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.5, startTime + 0.05);
        gain.gain.setValueAtTime(0.5, startTime + duration - 0.05);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      const t = ctx.currentTime;
      burst(t, 10);        // first 10-second tone
      burst(t + 15, 10);   // second 10-second tone after 5-second pause
    } catch(e) {}
  }

  // Start loading horn as soon as audio is unlocked (kept for compatibility)
  document.getElementById('splash').addEventListener('click', () => {
    setTimeout(() => {}, 200);
  });

  const hornFired = new Set();

  setInterval(() => {
    const nowSecs = nowSeconds();
    schedule.forEach((row, i) => {
      if (row.type !== 'Depart') return;
      const depSecs = parseTime(row.time) * 60;
      const secsUntil = depSecs - nowSecs;
      if (secsUntil <= 0 && secsUntil > -2 && !hornFired.has(i)) {
        hornFired.add(i);
        playDepartureTone();
      }
    });
  }, 1000);
</script>
</body>
</html>
